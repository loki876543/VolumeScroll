name: Zai fetch

on:
  push:
    branches: [main]
    paths-ignore:
      - racing.txt
      - last_seen.json
  schedule:
    - cron: "0 4 * * *"   # 07:00 MSK (UTC+3)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run zai-fetch
        run: python zai-fetch.py

      - name: Commit outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add racing.txt last_seen.json
          git diff --staged --quiet || git commit -m "Update racing $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
