name: Daily Aggregator
on:
  schedule:
    - cron: "55 * * * *"   # hourly at :55 UTC
  workflow_dispatch:       # manual run

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests beautifulsoup4 lxml feedparser

      - name: Run aggregator
        run: python aggregator.py
