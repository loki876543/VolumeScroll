name: Daily Aggregator
on:
  schedule:
    - cron: "55 * * * *"   # каждый день в 6:00 UTC
  workflow_dispatch:       # ручной запуск

permissions:
  contents: write          # ← обязательно для коммита из Actions

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests beautifulsoup4 lxml feedparser

      - name: Run aggregator
        run: python aggregator.py

      - name: Commit and push report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report.txt reports/
          # коммитим только если есть изменения
          git diff --staged --quiet || git commit -m "Update report $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
