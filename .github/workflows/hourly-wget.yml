name: Hourly Wget

on:
  schedule:
    # Каждый час в 15 минут (UTC). Смещение от 00 минут снижает риск задержки.
    - cron: '55 * * * *'
  # Позволяет запускать workflow вручную из вкладки Actions
  workflow_dispatch:

# Даём workflow право делать push в репозиторий
permissions:
  contents: write

# Предотвращает одновременный запуск двух копий workflow
concurrency:
  group: hourly-wget
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Токен с правом записи, чтобы push сработал
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download file with wget
        run: |
          # -O задаёт имя файла, -q тихий режим, но покажет ошибки
          wget -q --show-progress -O strana.htm https://strana.news/news.html

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add strana.htm

          # Если файл не изменился — выходим без пустого коммита
          if git diff --staged --quiet; then
            echo "No changes detected. Nothing to commit."
            exit 0
          fi

          git commit -m "Automated hourly download: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          # На случай, если кто-то успел запушить между checkout и push
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
