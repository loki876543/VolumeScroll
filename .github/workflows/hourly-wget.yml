name: Hourly Wget

on:
  schedule:
    # Запуск каждый час в 00 минут (UTC)
    - cron: '0 * * * *'
  # Позволяет запускать workflow вручную для тестирования
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
      - uses: actions/checkout@v4
      - name: Run wget
        run: |
          wget https://strana.news/news.html -O strana.htm
          git config loki876543 "github-actions[bot]"
          git config t79263733712@gmail.com "github-actions[bot]@users.noreply.github.com"
          git add strana.htm
          # Эта строка предотвращает ошибку, если файл не изменился
          git diff --staged --quiet || git commit -m "Automated hourly download"
          git push
